<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Project Documentation</title>
</head>

<body>

    <h1>CRM Project Documentation</h1>

    <p>Vercel deployment is working successfully.</p>

    <hr>

    <div id="readme">
        Loading README...
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        fetch("./README.md")
            .then(response => {
                if (!response.ok) {
                    throw new Error("README.md not found");
                }
                return response.text();
            })
            .then(markdown => {
                document.getElementById("readme").innerHTML =
                    marked.parse(markdown);
            })
            .catch(error => {
                document.getElementById("readme").innerHTML =
                    "<h2>README could not be loaded.</h2>";
                console.error(error);
            });
    </script>

</body>
</html>
